# CHẾ ĐỘ GATEWAY - chỉ dùng khi portal do công ty tự vận hành (hoặc có thể đặt reverse proxy phía trước).
# Mọi request tới portal đi qua Nginx; Nginx hỏi DLP backend (/api/gate) trước khi cho qua.
# Download của user không có quyền => 403 ngay tại server, không phụ thuộc trình duyệt/máy client.

upstream portal_upstream { server 10.0.0.10:443; }   # <-- địa chỉ portal thật
upstream dlp_backend     { server 127.0.0.1:8080; }

server {
    listen 443 ssl;
    server_name portal.congty.local;                    # <-- domain user truy cập
    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;

    location / {
        auth_request /__dlp_gate;
        error_page 403 = @dlp_blocked;
        proxy_pass https://portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /__dlp_gate {
        internal;
        proxy_pass http://dlp_backend/api/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Agent-Key "CHANGE_ME_AGENT_KEY";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Định danh user: lấy từ SSO/IdP. Ví dụ dùng header do oauth2-proxy / Keycloak gatekeeper gắn vào:
        proxy_set_header X-Portal-User $http_x_auth_request_email;
        # Hoặc lấy từ Basic auth / client cert: $remote_user, $ssl_client_s_dn
    }

    location @dlp_blocked {
        default_type text/html;
        return 403 '<h2>Download bị chặn</h2><p>Bạn chưa được cấp quyền tải file này. Liên hệ quản trị viên.</p>';
    }
}
