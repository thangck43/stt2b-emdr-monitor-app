<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Portal DLP Agent</title>

body{margin:0;padding:12px;width:280px;font:13px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:15px;margin:0 0 8px}.row{margin:4px 0}.m{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}

<div class="row m" id="mode"></div>
<p class="m">Hoạt động truy cập portal và download được ghi nhận theo chính sách bảo mật của công ty.</p>
<script src="popup.js"></script>
</body></html>
